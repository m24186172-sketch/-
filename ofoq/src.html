<title>أُفُق</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* أفق: هوية الإصدار الثاني ٢٠٢٦. هيدر كحلي بالمدارات والقوس، تحته محتوى على ورق، وتبويبات سفلية للجوال أولاً */
:root{
  --navy:#100B71; --navy-900:#0A0748; --navy-950:#07052E; --navy-700:#2B2690; --navy-500:#5B57B0; --navy-300:#A9A6D6; --navy-100:#E4E3F3; --navy-50:#F3F2FA;
  --red:#FF3C40; --red-600:#D6282D; --red-100:#FFE3E3; --plum:#872457; --blush:#FFEEEE;
  --ink:#14113F; --ink-2:#57546F; --line:#E6E2EC; --bg:#FBF9FA; --mist:#F6F1F4; --card:#FFFFFF;
  --hero:#100B71; --hero-2:#0A0748; --primary:#100B71; --on-primary:#FFFFFF; --primary-hover:#2B2690;
  --chip:#F3F2FA; --chip-ink:#100B71; --ok:#1F7A55; --ok-bg:#E6F4EE;
  --dawn:linear-gradient(90deg,#100B71 0%,#872457 50%,#FF3C40 100%);
  --font:"Thmanyah Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --display:"Thmanyah Serif Display","IBM Plex Sans Arabic",system-ui,sans-serif; /* خط ثمانية يتركّب هنا أول ما توصل ملفاته */
  --r-sm:12px; --r:18px; --pill:999px; --slant:-11.9deg;
  --shadow:0 8px 24px rgba(16,11,113,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#F3F2FA; --ink-2:#A9A6D6; --line:#2A2570; --bg:#0B0838; --mist:#120E45; --card:#16124F;
  --hero:#100B71; --hero-2:#07052E; --primary:#F3F2FA; --on-primary:#100B71; --primary-hover:#E4E3F3;
  --red:#FF5A5D; --red-100:#3A1640; --blush:#2A1446; --chip:#221D63; --chip-ink:#E4E3F3; --ok:#5FD3A0; --ok-bg:#123C3A;
  --shadow:0 8px 24px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --ink:#F3F2FA; --ink-2:#A9A6D6; --line:#2A2570; --bg:#0B0838; --mist:#120E45; --card:#16124F;
  --hero:#100B71; --hero-2:#07052E; --primary:#F3F2FA; --on-primary:#100B71; --primary-hover:#E4E3F3;
  --red:#FF5A5D; --red-100:#3A1640; --blush:#2A1446; --chip:#221D63; --chip-ink:#E4E3F3; --ok:#5FD3A0; --ok-bg:#123C3A;
  --shadow:0 8px 24px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hero)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid rgba(255,60,64,.45);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;line-height:1.35;margin:0;text-wrap:balance}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- logo ---------- */
.logo{display:inline-block;position:relative;aspect-ratio:478/378}
.logo svg{position:absolute;inset:0;width:100%;height:100%}
.logo .a{fill:url(#lg-dawn)} .logo .l{fill:var(--navy)}
.logo.white .a,.logo.white .l{fill:#fff}

/* ---------- hero / header ---------- */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 100%,var(--hero) 0%,var(--hero-2) 100%);color:#fff;padding-block:14px 26px}
.hero .orbits{position:absolute;inset:auto -40% -60% -40%;height:150%;pointer-events:none;opacity:.55}
.hero .rise{position:absolute;left:50%;bottom:-150px;width:440px;height:220px;transform:translateX(-50%);border-radius:50%;border:12px solid transparent;background:var(--dawn) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.95;pointer-events:none}
.hero > *{position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.topbar .logo{width:56px}
.iconbtn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:var(--pill);border:0;background:rgba(255,255,255,.1);color:#fff}
.iconbtn:hover{background:rgba(255,255,255,.18)}
.iconbtn svg{width:22px;height:22px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--red)}
.eyebrow::before{content:"";width:8px;height:8px;background:currentColor;transform:rotate(35deg);border-radius:1px}
.hero .eyebrow{color:#FFC2C3}
.hello{margin-top:10px}
.hello small{display:block;color:var(--navy-300);font-size:15px}
.hello h1{font-size:30px;color:#fff}

/* demo banner */
.demo{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--blush);color:var(--ink);font-size:13px;padding-block:8px}
.demo b{color:var(--red)}
.demo button{border:1px solid var(--line);background:var(--card);border-radius:var(--pill);padding:4px 12px;font-size:13px;font-weight:500}

/* ---------- main ---------- */
main{flex:1;padding-block:20px 110px;display:flex;flex-direction:column;gap:22px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec-h h2{font-size:21px;display:flex;align-items:center;gap:10px}
.sec-h h2::after{content:"";width:22px;height:4px;border-radius:4px;background:var(--red);transform:rotate(var(--slant))}
.link{border:0;background:none;color:var(--ink-2);font-size:14px;font-weight:500;padding:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.row{display:flex;align-items:center;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:var(--pill);border:0;font-size:17px;font-weight:700;background:var(--primary);color:var(--on-primary);transition:background .15s,transform .1s}
.btn:hover{background:var(--primary-hover)}
.btn:active{transform:scale(.98)}
.btn.dawn{background:var(--dawn);color:#fff}
.btn.ghost{background:var(--mist);color:var(--ink)}
.btn.outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary)}
.btn.danger{background:var(--red-600);color:#fff}
.btn.block{width:100%}
.btn.big{height:60px;font-size:20px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:20px;height:20px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:var(--pill);background:var(--chip);color:var(--chip-ink);font-size:13px;font-weight:500;white-space:nowrap}
.chip.red{background:var(--red-100);color:var(--red)}
.chip.red::before{content:"";width:7px;height:7px;background:currentColor;transform:rotate(35deg)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.solid{background:var(--primary);color:var(--on-primary)}

input.field{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 16px;font-size:17px}
input.field:focus{outline:none;border-color:var(--navy-500);box-shadow:0 0 0 4px rgba(91,87,176,.18)}
label.lbl{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px}

/* ---------- login ---------- */
.login .hero{padding-block:36px 150px;text-align:center}
.login .hero .logo{width:150px}
.login .hero h1{font-size:32px;margin-top:18px}
.login .hero p{margin:4px 0 0;color:var(--navy-300)}
.login-card{margin-top:-110px;position:relative;z-index:2;box-shadow:var(--shadow)}
.code-input{text-align:center;letter-spacing:.5em;font-size:28px!important;height:64px!important;font-family:var(--display);direction:ltr}
.err{color:var(--red);font-size:14px;min-height:22px;text-align:center}
.try{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.try button{border:1px dashed var(--navy-300);background:transparent;border-radius:var(--pill);padding:4px 14px;font-size:13px;color:var(--ink-2)}
footer.foot{text-align:center;font-size:13px;color:var(--ink-2);padding-block:22px}

/* ---------- streak ---------- */
.streak{display:flex;align-items:center;gap:14px;margin-top:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:var(--r);padding:12px 16px}
.flame{width:46px;height:54px;flex:none}
.flame.off{filter:grayscale(1) opacity(.5)}
.streak .n{font-size:38px;line-height:1;color:#fff}
.streak .t{font-size:14px;color:var(--navy-300);line-height:1.5}
.streak .t b{color:#fff;font-weight:700;display:block;font-size:16px}
.rank-pill{margin-inline-start:auto;text-align:center;font-size:12px;color:var(--navy-300)}
.rank-pill b{display:block;font-family:var(--display);font-size:20px;color:#fff;line-height:1.2}

/* ---------- check-in ---------- */
.checkin{position:relative;overflow:hidden}
.checkin h3{font-size:22px}
.checkin .meta{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.pin{display:flex;gap:10px;justify-content:center;direction:ltr;margin-bottom:12px}
.pin input{width:56px;height:64px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:center;font-size:28px;font-family:var(--display)}
.pin input:focus{outline:none;border-color:var(--navy-500);box-shadow:0 0 0 4px rgba(91,87,176,.18)}
.done{display:flex;align-items:center;gap:14px;background:var(--ok-bg);color:var(--ok);border-radius:14px;padding:14px 16px;font-weight:700}
.done svg{width:30px;height:30px;flex:none}
.done small{display:block;font-weight:400;opacity:.85}
.closed{display:flex;align-items:center;gap:12px;background:var(--mist);border-radius:14px;padding:14px 16px;color:var(--ink-2)}
.closed svg{width:26px;height:26px;flex:none}
.pulse{width:10px;height:10px;background:var(--red);transform:rotate(35deg);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- horizon ruler ---------- */
.ruler svg{width:100%;height:auto;display:block}
.ruler .legend{display:flex;justify-content:center;gap:16px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.ruler .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px;vertical-align:middle}
.ruler-center{text-anchor:middle}

/* ---------- badges ---------- */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 8px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.medal{width:52px;height:52px;flex:none}
.badge b{font-size:14px;line-height:1.4}
.badge small{font-size:12px;color:var(--ink-2);line-height:1.4}
.badge.locked .medal{filter:grayscale(1);opacity:.3}
.badge.locked b{color:var(--ink-2)}
.badge.new{border-color:var(--red);box-shadow:0 0 0 3px var(--red-100)}

/* ---------- level ---------- */
.level{display:flex;align-items:center;gap:14px}
.level .bar{height:10px;border-radius:10px;background:var(--mist);overflow:hidden;margin-top:6px}
.level .bar span{display:block;height:100%;background:var(--dawn);border-radius:10px}

/* ---------- leaderboard ---------- */
.lb{display:flex;flex-direction:column;gap:8px}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.lb-row.me{border-color:var(--navy-500);box-shadow:0 0 0 3px rgba(91,87,176,.15)}
.lb-row .pos{width:30px;text-align:center;font-family:var(--display);font-size:20px;color:var(--ink-2)}
.lb-row.top1{background:linear-gradient(90deg,rgba(16,11,113,.06),rgba(255,60,64,.10))}
.lb-row .cnt{font-family:var(--display);font-size:20px}
.lb-row .fl{display:inline-flex;align-items:center;gap:2px;font-size:13px;color:var(--red);font-weight:700}
.lb-row .fl svg{width:14px;height:16px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--chip-ink);font-weight:700;font-size:15px;flex:none}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;text-align:center}
.podium .p{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 10px 10px;padding:12px 6px}
.podium .p .avatar{margin:0 auto 6px;width:46px;height:46px;font-size:17px}
.podium .p b{display:block;font-size:14px;line-height:1.4}
.podium .p.first{padding-block:18px 14px;background:var(--hero);color:#fff;border:0}
.podium .p.first .avatar{background:#fff;color:var(--navy);width:56px;height:56px}
.podium .crown{display:block;margin:0 auto 4px;width:26px;height:20px}

/* ---------- history ---------- */
.hist{display:flex;flex-direction:column}
.hist .h{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.hist .h:last-child{border-bottom:0}
.dot{width:12px;height:12px;transform:rotate(35deg);border-radius:2px;flex:none}
.dot.y{background:var(--navy)} .dot.n{background:var(--line)} .dot.f{background:transparent;border:1.5px dashed var(--navy-300)} .dot.c{background:var(--red)}
:root[data-theme="dark"] .dot.y{background:#A9A6D6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dot.y{background:#A9A6D6}}

/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;font-size:12px;font-weight:500;color:var(--ink-2);position:relative}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:3px;background:var(--red)}

/* ---------- admin ---------- */
.seg{display:flex;background:var(--mist);border-radius:var(--pill);padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:var(--pill);padding:8px 10px;font-size:14px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(16,11,113,.12)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:start}
.li:last-child{border-bottom:0}
.li .nm{font-weight:500;line-height:1.4}
.li .sub{font-size:13px;color:var(--ink-2)}
.toggle-att{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.toggle-att.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.toggle-att svg{width:20px;height:20px}
.bigpin{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--hero);color:#fff;border-radius:16px;padding:14px 18px}
.bigpin .d{font-family:var(--display);font-size:40px;letter-spacing:.3em;direction:ltr;line-height:1.1}
.bigpin small{color:var(--navy-300);display:block;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.kpi .num{font-size:28px;line-height:1.2;display:block}
.kpi small{font-size:12px;color:var(--ink-2)}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px;direction:ltr}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.bars .b span{display:block;width:100%;max-width:28px;border-radius:6px 6px 2px 2px;background:var(--navy-500)}
.bars .b.cur span{background:var(--red)}
.bars .b small{font-size:11px;color:var(--ink-2)}
.bars .b em{font-style:normal;font-size:11px;color:var(--ink);font-weight:700}
.search{position:relative}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink-2)}
.search input{padding-inline-start:44px}
.code-tag{font-family:var(--display);direction:ltr;letter-spacing:.12em;background:var(--mist);border-radius:8px;padding:0 8px;font-size:15px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{width:52px;height:30px;border-radius:30px;border:0;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{inset-inline-start:25px}
textarea.field{width:100%;min-height:120px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:12px 16px;font-size:16px;resize:vertical}


/* ---------- قائمة الدروس ---------- */
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.lesson{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 10px;width:100%;text-align:start}
.lesson.is-none{border-color:var(--navy-300);box-shadow:0 0 0 3px rgba(91,87,176,.10)}
.lesson.admin{cursor:pointer}
.lesson.admin:hover{border-color:var(--navy-500)}
.ln{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--hero);color:#fff;font-size:18px;font-weight:700}
.ln.sm{width:30px;height:30px;font-size:14px;border-radius:9px}
.lesson.is-p .ln{background:var(--dawn)}
.lt{font-weight:700;line-height:1.45}
.ld{font-size:13px;color:var(--ink-2);line-height:1.5}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pa{display:flex;gap:6px;flex:none}
.pa button{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 12px;border-radius:var(--pill);border:1.5px solid var(--line);background:var(--card);color:var(--ink-2);font-size:14px;font-weight:700}
.pa button svg{width:16px;height:16px}
.pa button[data-mark="p"][aria-pressed="true"],.pa button[data-set="p"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.pa button[data-mark="a"][aria-pressed="true"],.pa button[data-set="a"][aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.pa.sm button{height:34px;padding:0 10px;font-size:13px}
@media (max-width:380px){.pa button{padding:0 9px}.pa button svg{display:none}}
/* ---------- sheet / toast / celebrate ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(7,5,46,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .25s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:22px;margin-bottom:6px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--pill);font-size:15px;font-weight:500;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);animation:up .2s;max-width:calc(100% - 32px)}

<script>
"use strict";
/* ==================== التخزين ====================
   النسخة هذي تجريبية: البيانات محفوظة في جهازك (localStorage).
   للتشغيل الحقيقي مع الطلاب نبدّل طبقة التخزين بقاعدة بيانات مجانية بدون ما نغيّر الواجهة. */
const KEY = "ofoq-demo-v2", SKEY = "ofoq-session-v2";
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

const DAY = 864e5;
const iso = d => { const x = new Date(d); x.setHours(0,0,0,0); return x.toISOString().slice(0,10); };
const todayISO = () => iso(Date.now());
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const uid = () => Math.random().toString(36).slice(2, 9);
const pin4 = () => String(Math.floor(1000 + Math.random()*9000));

function seed(){
  const r = rng(26);
  const names = ["عبدالله الحربي","محمد العتيبي","فيصل القحطاني","سعود الشمري","عبدالرحمن الدوسري","تركي المطيري","خالد الزهراني","نواف السبيعي","يوسف الغامدي","عمر العنزي","سلمان الشهري","بدر الرشيدي","ريان العمري","حمد السهلي"];
  const titles = ["أبو بكر الصديق ١","أبو بكر الصديق ٢","عمر بن الخطاب ١","عمر بن الخطاب ٢","عمر بن الخطاب ٣","عثمان بن عفان ١","عثمان بن عفان ٢","علي بن أبي طالب ١","علي بن أبي طالب ٢"];
  const L = titles.length;
  const lessons = titles.map((t,i) => ({ id:"L"+(i+1), n:i+1, title:t, date: iso(Date.now() - (L-1-i)*7*DAY) }));
  const used = new Set(["0000"]);
  const students = names.map((n,i) => { let c = i===0 ? "1234" : ""; while(!c || used.has(c)) c = pin4(); used.add(c); return { id:"S"+(i+1), name:n, code:c }; });
  const att = {};
  const prof = students.map(() => .45 + r()*.5);
  lessons.forEach((l,li) => {
    att[l.id] = {};
    const base = new Date(l.date+"T20:00:00").getTime(); let k = 0;
    const last = li === L-1;
    students.forEach((s,si) => {
      if (si === 0) { if (!last) att[l.id][s.id] = { s: li===3 ? "a" : "p", t: base + (k++)*40000 }; return; } // عبدالله: غاب مرة، وآخر درس ما سجّله
      const x = r();
      if (last && x < .5) return;                         // آخر درس: نص الطلاب للحين ما سجّلوا
      if (x < prof[si]) att[l.id][s.id] = { s:"p", t: base + (k++)*40000 + Math.floor(r()*60000) };
      else if (x < prof[si] + .25) att[l.id][s.id] = { s:"a", t: base + 3600000 };
    });
  });
  return { v:2, demo:true, adminCode:"0000", students, lessons, att };
}

let S = lsGet(KEY) || seed();
let session = lsGet(SKEY);
const save = () => lsSet(KEY, S);
if (!lsGet(KEY)) save();

/* ==================== الحسابات ==================== */
const lessonsSorted = () => [...S.lessons].sort((a,b) => a.n - b.n);
const lessonById = id => S.lessons.find(l => l.id === id);
const markOf = (lid, sid) => S.att[lid]?.[sid]?.s || "";
const isAtt = (lid, sid) => markOf(lid, sid) === "p";
const lastLesson = () => lessonsSorted().slice(-1)[0];

// الشعلة: كم درس حضره ورا بعض لين آخر درس. آخر درس لو ما سجّله للحين ما يطفّي الشعلة
function streakOf(sid){
  const ls = lessonsSorted(); let n = 0, i = ls.length - 1;
  if (i >= 0 && !markOf(ls[i].id, sid)) i--;
  for (; i >= 0 && isAtt(ls[i].id, sid); i--) n++;
  return n;
}
function bestStreak(sid){ let b=0,c=0; lessonsSorted().forEach(l => { if (isAtt(l.id,sid)) b = Math.max(b, ++c); else c = 0; }); return b; }
const totalOf = sid => S.lessons.filter(l => isAtt(l.id, sid)).length;
const absentOf = sid => S.lessons.filter(l => markOf(l.id, sid) === "a").length;
const monthKey = d => d.slice(0,7);
function monthCounts(mk = monthKey(todayISO())){
  const ls = S.lessons.filter(l => monthKey(l.date) === mk);
  return S.students.map(s => ({ s, n: ls.filter(l => isAtt(l.id, s.id)).length, streak: streakOf(s.id) }))
    .sort((a,b) => b.n - a.n || b.streak - a.streak || a.s.name.localeCompare(b.s.name, "ar"));
}
function ranked(rows){ let pos=0, prev=null; return rows.map((r,i) => { if (r.n !== prev){ pos = i+1; prev = r.n; } return {...r, pos}; }); }
function rateOf(sid){ const n = S.lessons.length; return n ? Math.round(100*totalOf(sid)/n) : 0; }
function presentOrder(lid, sid){ const a = S.att[lid] || {}; if (a[sid]?.s !== "p") return 0; const t = a[sid].t; return Object.values(a).filter(x => x.s === "p" && x.t <= t).length; }
const countOf = (lid, s) => Object.values(S.att[lid] || {}).filter(x => x.s === s).length;

const LEVELS = [
  { n:0,  name:"فجر",   desc:"بداية الرحلة" },
  { n:3,  name:"شروق",  desc:"طلع نورك" },
  { n:6,  name:"ضحى",   desc:"ثابت ومستمر" },
  { n:9,  name:"ظهيرة", desc:"في كبد السماء" },
  { n:12, name:"الأفق كامل", desc:"ما فاتك شي" },
];
function levelOf(sid){ const t = totalOf(sid); let i = 0; LEVELS.forEach((L,k) => { if (t >= L.n) i = k; }); const nxt = LEVELS[i+1]; return { ...LEVELS[i], i, t, next: nxt, pct: nxt ? Math.round(100*(t-LEVELS[i].n)/(nxt.n-LEVELS[i].n)) : 100 }; }

const BADGES = [
  { id:"first",  name:"أول خطوة",    how:"احضر أول درس",                 test: s => totalOf(s) >= 1 },
  { id:"s3",     name:"شعلة ٣",      how:"احضر ٣ دروس ورا بعض",          test: s => bestStreak(s) >= 3 },
  { id:"s5",     name:"شعلة ٥",      how:"احضر ٥ دروس ورا بعض",          test: s => bestStreak(s) >= 5 },
  { id:"s10",    name:"شعلة ١٠",     how:"احضر ١٠ دروس ورا بعض",         test: s => bestStreak(s) >= 10 },
  { id:"early",  name:"المبكّر",      how:"كن من أول ٣ يسجّلون حضورهم في درس", test: s => S.lessons.some(l => { const o = presentOrder(l.id, s); return o>0 && o<=3; }) },
  { id:"champ",  name:"بطل الشهر",   how:"أكثر واحد حضور في الشهر",       test: s => { const r = ranked(monthCounts()); const me = r.find(x => x.s.id===s); return me && me.pos===1 && me.n>0; } },
  { id:"full",   name:"شهر كامل",    how:"احضر كل دروس شهر (٣ دروس وأكثر)", test: s => { const by = {}; S.lessons.forEach(l => (by[monthKey(l.date)] ||= []).push(l)); return Object.values(by).some(ls => ls.length>=3 && ls.every(l => isAtt(l.id,s))); } },
  { id:"back",   name:"العودة",      how:"ارجع تحضر بعد غياب",            test: s => { let missed=false; for (const l of lessonsSorted()){ if (isAtt(l.id,s)) { if (missed) return true; } else if (markOf(l.id,s)==="a") missed = true; } return false; } },
  { id:"half",   name:"نص الطريق",   how:"احضر نص دروس الدورة",           test: s => S.lessons.length>0 && totalOf(s) >= Math.ceil(S.lessons.length/2) },
];
const earned = sid => BADGES.filter(b => b.test(sid)).map(b => b.id);

/* ==================== أدوات ==================== */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ar = n => Number(n).toLocaleString("ar-SA");
const toLatin = s => String(s).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/\D/g,"");
const fmtDate = d => new Date(d+"T12:00:00").toLocaleDateString("ar-SA-u-ca-gregory", { weekday:"long", day:"numeric", month:"long" });
const fmtShort = d => new Date(d+"T12:00:00").toLocaleDateString("ar-SA-u-ca-gregory", { day:"numeric", month:"short" });
const monthName = () => new Date().toLocaleDateString("ar-SA-u-ca-gregory", { month:"long" });
const initials = n => esc(String(n).trim().charAt(0));
const firstName = n => esc(String(n).trim().split(/\s+/)[0]);
const ic = (id, cls="") => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const flame = (cls="") => `<svg class="flame ${cls}" viewBox="0 0 46 54" aria-hidden="true"><use href="#i-flame"/></svg>`;
const logo = (white=false, style="") => `<span class="logo ${white?"white":""}" style="${style}" role="img" aria-label="أفق"><svg><use class="a" href="#logo-arc"/></svg><svg><use class="l" href="#logo-letters"/></svg></span>`;
async function copyText(t){ try { await navigator.clipboard.writeText(t); toast("انتسخ ✓"); } catch(e){ sheet(`<h3>انسخه من هنا</h3><textarea class="field" id="cp" readonly>${esc(t)}</textarea>`); const ta=$("#cp"); ta.focus(); ta.select(); } }
let toastT;
function toast(msg, undo){ document.querySelectorAll(".toast").forEach(t => t.remove()); clearTimeout(toastT);
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.innerHTML = `<span>${msg}</span>` + (undo ? `<button>تراجع</button>` : "");
  if (undo) t.querySelector("button").onclick = () => { undo(); t.remove(); };
  document.body.appendChild(t); toastT = setTimeout(() => t.remove(), 3500); }
function sheet(html, onMount){ closeSheet(); const s = document.createElement("div"); s.className = "scrim"; s.id = "scrim";
  s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  s.addEventListener("click", e => { if (e.target === s) closeSheet(); }); document.body.appendChild(s); onMount && onMount(s); }
function closeSheet(){ const s = $("#scrim"); s && s.remove(); }
window.closeSheet = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* مسطرة الأفق: قوس فيه علامة لكل درس */
function ruler(ticks, opts={}){
  const W=340, H=150, cx=W/2, cy=136, rx=150, ry=118, n=ticks.length;
  const pt = (t, k=1) => [cx - rx*k*Math.cos(Math.PI*t), cy - ry*k*Math.sin(Math.PI*t)];
  const prog = Math.max(0, Math.min(1, opts.progress ?? 0));
  const [ex,ey] = pt(prog);
  let g = `<defs><linearGradient id="rg${opts.id||""}" gradientUnits="userSpaceOnUse" x1="${cx-rx}" x2="${cx+rx}"><stop offset="0" stop-color="#100B71"/><stop offset=".5" stop-color="#872457"/><stop offset="1" stop-color="#FF3C40"/></linearGradient></defs>`;
  [0.55,0.75].forEach(k => g += `<ellipse cx="${cx}" cy="${cy}" rx="${rx*k}" ry="${ry*k}" fill="none" stroke="var(--line)" stroke-width="1"/>`);
  g += `<path d="M${cx-rx} ${cy} A${rx} ${ry} 0 0 1 ${cx+rx} ${cy}" fill="none" stroke="var(--mist)" stroke-width="12" stroke-linecap="round"/>`;
  if (prog > 0) g += `<path d="M${cx-rx} ${cy} A${rx} ${ry} 0 0 1 ${ex.toFixed(1)} ${ey.toFixed(1)}" fill="none" stroke="url(#rg${opts.id||""})" stroke-width="12" stroke-linecap="round"/>`;
  ticks.forEach((tk,i) => {
    const t = n===1 ? .5 : i/(n-1); const [x1,y1] = pt(t,1.09); const [x2,y2] = pt(t, tk==="y"?1.2:1.15);
    const col = tk==="y" ? "var(--ink)" : tk==="c" ? "#FF3C40" : "var(--navy-300)";
    g += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}" stroke-width="${tk==="y"||tk==="c"?2.4:1.4}" stroke-linecap="round" opacity="${tk==="f"?.5:1}"/>`;
  });
  if (prog > 0) g += `<rect x="${(ex-6).toFixed(1)}" y="${(ey-6).toFixed(1)}" width="12" height="12" fill="#FF3C40" transform="rotate(35 ${ex.toFixed(1)} ${ey.toFixed(1)})"/>`;
  g += `<text x="${cx}" y="${cy-30}" class="ruler-center num" font-size="38" font-weight="700" fill="var(--ink)">${opts.big ?? ""}</text><text x="${cx}" y="${cy-2}" class="ruler-center" font-size="14" fill="var(--ink-2)">${opts.small ?? ""}</text>`;
  return `<svg viewBox="-12 -12 ${W+24} ${H+12}" role="img" aria-label="${esc(opts.label||"")}">${g}</svg>`;
}

function orbits(){ let s = `<svg class="orbits" viewBox="0 0 800 500" preserveAspectRatio="xMidYMax slice" aria-hidden="true">`; for (let i=1;i<=9;i++) s += `<ellipse cx="400" cy="500" rx="${i*52}" ry="${i*40}" fill="none" stroke="rgba(169,166,214,.22)" stroke-width="1"/>`; return s + `</svg>`; }

function medalSVG(b, on=true, glyphOverride){
  const glyph = glyphOverride || { first:"١", s3:"٣", s5:"٥", s10:"١٠", early:"◆", champ:"♛", full:"٣٠", back:"↺", half:"½" }[b.id] || "◆";
  const flameB = /^s\d/.test(b.id);
  return `<svg class="medal" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24" fill="${on?"url(#g-medal)":"var(--line)"}"/><circle cx="26" cy="26" r="18.5" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/>${flameB?`<svg x="15" y="11" width="22" height="26" viewBox="0 0 46 54"><use href="#i-flame"/></svg><text x="26" y="45" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="inherit">${glyph}</text>`:`<text x="26" y="33" text-anchor="middle" font-size="${glyph.length>1?16:20}" font-weight="700" fill="#fff" font-family="inherit">${glyph}</text>`}</svg>`;
}

/* ==================== الحالة والتنقل ==================== */
let tab = "home";
function setSession(s){ session = s; lsSet(SKEY, s); tab = "home"; render(); window.scrollTo(0,0); }
function go(t){ tab = t; render(); window.scrollTo(0,0); }

function render(){
  const app = $("#app");
  if (!session) { app.innerHTML = viewLogin(); bindLogin(); return; }
  if (session.role === "admin") { app.innerHTML = demoBar() + adminView(); bindAdmin(); }
  else {
    const me = S.students.find(s => s.id === session.id);
    if (!me) { setSession(null); return; }
    app.innerHTML = demoBar() + studentView(me); bindStudent(me);
  }
}

function demoBar(){
  if (!S.demo) return "";
  const other = session.role === "admin" ? "شوف شاشة الطالب" : "شوف شاشة المشرف";
  return `<div class="demo wrap"><span><b>نسخة تجريبية</b> · الأسماء والأرقام أمثلة</span><button id="demo-switch">${other}</button></div>`;
}
function bindDemo(){ const b = $("#demo-switch"); if (b) b.onclick = () => setSession(session.role === "admin" ? { role:"student", id:"S1" } : { role:"admin" }); }

/* ==================== الدخول ==================== */
function viewLogin(){
  return `<div class="login">
    <header class="hero wrap">${orbits()}<div class="rise"></div>
      ${logo(true,"width:150px")}
      <h1>أهلاً بك في أُفُق</h1><p>أدخل رمزك وكمّل رحلتك</p>
    </header>
    <div class="wrap"><form class="card login-card stack" id="login-f" autocomplete="off">

    </form></div>

}
function bindLogin(){
  const f = $("#login-f"), inp = $("#code"), err = $("#login-err");
  const tryCode = c => {
    c = toLatin(c);
    if (!c) { err.textContent = "اكتب رمزك أول"; return; }
    if (c === S.adminCode) return setSession({ role:"admin" });
    const s = S.students.find(x => x.code === c);

    err.textContent = "الرمز غلط، تأكد منه وجرّب مرة ثانية"; inp.select();
  };
  f.onsubmit = e => { e.preventDefault(); tryCode(inp.value); };
  inp.oninput = () => { err.textContent = ""; };
  document.querySelectorAll(".try button").forEach(b => b.onclick = () => { inp.value = b.dataset.c; tryCode(b.dataset.c); });
}

/* ==================== الطالب ==================== */
function studentView(me){
  const st = streakOf(me.id), r = ranked(monthCounts()), mine = r.find(x => x.s.id === me.id);
  const tabs = [["home","الدروس","i-book"],["rank","الترتيب","i-trophy"],["badges","أوسمتي","i-medal"]];
  const body = tab === "rank" ? stRank(me, r) : tab === "badges" ? stBadges(me) : stHome(me);
  return `<header class="hero wrap">${orbits()}
      <div class="topbar">${logo(true,"width:56px")}<button class="iconbtn" id="logout" aria-label="خروج">${ic("i-out")}</button></div>
      <div class="hello"><small>هلا والله</small><h1>${firstName(me.name)}</h1></div>
      <div class="streak">${flame(st ? "" : "off")}
        <div><span class="n num">${ar(st)}</span></div>
        <div class="t"><b>${st===0 ? "ابدأ شعلتك" : st===1 ? "شعلة وحدة" : "شعلات ورا بعض"}</b>${streakLine(st)}</div>
        <div class="rank-pill">ترتيبك<b>${mine && mine.n ? ar(mine.pos) : "–"}</b>في ${monthName()}</div>
      </div>
    </header>
    <main class="wrap">${body}</main>
    <nav class="tabs" aria-label="التنقل"><div class="in">${tabs.map(([k,l,i]) => `<button data-tab="${k}" ${tab===k?'aria-current="page"':""}>${ic(i)}${l}</button>`).join("")}</div></nav>`;
}
function streakLine(n){
  if (n === 0) return "سجّل حضورك في الدرس وتولع أول شعلة";
  if (n === 1) return "احضر الجاي وتبدأ السلسلة";
  if (n < 3) return "باقي " + ar(3-n) + " عن وسام شعلة ٣";
  if (n < 5) return "باقي " + ar(5-n) + " عن وسام شعلة ٥";
  if (n < 10) return "باقي " + ar(10-n) + " عن وسام شعلة ١٠";
  return "ما شاء الله، لا توقف";
}

function lessonRow(l, me){
  const m = markOf(l.id, me.id);
  return `<li class="lesson ${m==="p"?"is-p":m==="a"?"is-a":"is-none"}">
    <span class="ln num">${ar(l.n)}</span>
    <div class="grow"><div class="lt">${esc(l.title)}</div><div class="ld">${fmtDate(l.date)}</div></div>
    <div class="pa" role="group" aria-label="${esc(l.title)}">
      <button data-mark="p" data-l="${l.id}" aria-pressed="${m==="p"}">${ic("i-check")}حاضر</button>
      <button data-mark="a" data-l="${l.id}" aria-pressed="${m==="a"}">غايب</button>
    </div></li>`;
}

function stHome(me){
  const ls = lessonsSorted();
  const pending = ls.filter(l => !markOf(l.id, me.id)).length;
  const tot = totalOf(me.id), lv = levelOf(me.id), eb = earned(me.id);
  const nextB = BADGES.find(b => !eb.includes(b.id));
  const ticks = ls.map(l => isAtt(l.id, me.id) ? "y" : markOf(l.id, me.id) === "a" ? "n" : "f");
  return `<section class="stack"><div class="sec-h"><h2>الدروس</h2>${pending ? `<span class="chip red">${ar(pending)} ما سجّلته</span>` : `<span class="chip ok">سجّلت الكل</span>`}</div>
      <ol class="lessons">${ls.map(l => lessonRow(l, me)).join("")}</ol>
      ${ls.length ? "" : `<p class="muted" style="text-align:center">ما فيه دروس للحين. يضيفها المشرف</p>`}</section>
    <section class="stack"><div class="sec-h"><h2>رحلتك في أفق</h2></div>
      <div class="card ruler">${ruler(ticks, { progress: ls.length ? tot/ls.length : 0, big: ar(tot)+" من "+ar(ls.length), small:"درس حضرته", id:"st", label:"حضرت "+tot+" من "+ls.length })}
        <div class="legend"><span><i style="background:var(--ink)"></i>حاضر</span><span><i style="background:var(--navy-300)"></i>غايب</span></div>
      </div>
      <div class="card level">${medalSVG({id:"lv"}, true, ar(lv.i+1))}
        <div class="grow"><b>مرتبتك: ${lv.name}</b> <span class="muted small">· ${lv.desc}</span>
          <div class="bar"><span style="width:${lv.pct}%"></span></div>
          <div class="muted small">${lv.next ? `باقي ${ar(lv.next.n - lv.t)} ${lv.next.n-lv.t===1?"درس":"دروس"} وتوصل «${lv.next.name}»` : "وصلت آخر مرتبة"}</div></div></div>
    </section>
    ${nextB ? `<section class="stack"><div class="sec-h"><h2>وسامك الجاي</h2><button class="link" data-tab="badges">كل الأوسمة</button></div>
      <div class="card row">${medalSVG(nextB,false)}<div class="grow"><b>${nextB.name}</b><div class="muted small">${nextB.how}</div></div></div></section>` : ""}
    <section class="stack"><div class="sec-h"><h2>أبطال ${monthName()}</h2><button class="link" data-tab="rank">الترتيب كامل</button></div>
      ${lbRows(ranked(monthCounts()).slice(0,3), me.id)}</section>`;
}

function lbRows(rows, meId){
  return `<div class="lb">${rows.map(r => `<div class="lb-row ${r.s.id===meId?"me":""} ${r.pos===1&&r.n?"top1":""}">
    <span class="pos">${r.pos===1&&r.n ? `<svg width="22" height="17" viewBox="0 0 26 20" aria-label="بطل الشهر"><use href="#i-crown"/></svg>` : ar(r.pos)}</span>
    <span class="avatar">${initials(r.s.name)}</span>
    <div class="grow"><div style="font-weight:500;line-height:1.4">${esc(r.s.name)}${r.s.id===meId?" <span class='chip'>أنت</span>":""}</div>
      ${r.streak ? `<span class="fl">${ic("i-flame")}${ar(r.streak)}</span>` : `<span class="muted small">بدون شعلة</span>`}</div>
    <span class="cnt">${ar(r.n)}</span></div>`).join("")}</div>`;
}

function stRank(me, r){
  const top = r.slice(0,3);
  const p = (x, cls) => x ? `<div class="p ${cls}">${cls==="first"?`<svg class="crown" viewBox="0 0 26 20"><use href="#i-crown"/></svg>`:""}<span class="avatar">${initials(x.s.name)}</span><b>${firstName(x.s.name)}</b><span class="num" style="font-size:22px;font-weight:700">${ar(x.n)}</span><div class="small" style="opacity:.75">${cls==="first"?"بطل الشهر":"حضور"}</div></div>` : "<div></div>";
  return `<section class="stack"><div class="sec-h"><h2>ترتيب ${monthName()}</h2><span class="chip">بعدد الحضور</span></div>
      <div class="podium">${p(top[1],"")}${p(top[0],"first")}${p(top[2],"")}</div>
      <p class="muted small" style="margin:0">أكثر واحد يحضر في الشهر ياخذ وسام «بطل الشهر». لو تعادلوا، يتقدّم صاحب الشعلة الأطول.</p>
      ${lbRows(r, me.id)}</section>`;
}

function stBadges(me){
  const eb = earned(me.id), lv = levelOf(me.id);
  return `<section class="stack"><div class="sec-h"><h2>أوسمتي</h2><span class="chip solid">${ar(eb.length)} من ${ar(BADGES.length)}</span></div>
    <div class="badges">${BADGES.map(b => { const on = eb.includes(b.id); return `<button class="badge ${on?"":"locked"}" data-badge="${b.id}">${medalSVG(b,on)}<b>${b.name}</b><small>${on?"حصّلته":b.how}</small></button>`; }).join("")}</div>
    <div class="sec-h" style="margin-top:8px"><h2>المراتب</h2></div>
    <div class="card list">${LEVELS.map((L,i) => `<div class="li"><span class="dot ${i<=lv.i?"y":"n"}"></span><div class="grow"><div class="nm">${L.name}</div><div class="sub">${L.n===0?"من أول درس":"من "+ar(L.n)+" دروس"} · ${L.desc}</div></div>${i===lv.i?`<span class="chip red">أنت هنا</span>`:""}</div>`).join("")}</div>
  </section>`;
}

function bindStudent(me){
  bindDemo();
  $("#logout").onclick = () => setSession(null);
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => go(b.dataset.tab));
  document.querySelectorAll("[data-badge]").forEach(b => b.onclick = () => {
    const B = BADGES.find(x => x.id === b.dataset.badge), on = earned(me.id).includes(B.id);
    sheet(`<div style="text-align:center" class="stack">${medalSVG(B,on).replace('class="medal"','class="medal" style="width:96px;height:96px;margin:0 auto"')}<h3>${B.name}</h3><p class="muted" style="margin:0">${B.how}</p>${on?`<span class="chip ok" style="margin:0 auto">حصّلته ✓</span>`:`<span class="chip" style="margin:0 auto">للحين ما حصّلته</span>`}<button class="btn block" onclick="closeSheet()">تمام</button></div>`);
  });
  document.querySelectorAll("[data-mark]").forEach(b => b.onclick = () => {
    const lid = b.dataset.l, m = b.dataset.mark, prev = S.att[lid]?.[me.id];
    if (prev?.s === m) return;
    const before = earned(me.id), prevStreak = streakOf(me.id);
    (S.att[lid] ||= {})[me.id] = { s:m, t: Date.now() }; save();
    if (m === "p") {
      const st = streakOf(me.id), nb = earned(me.id).filter(x => !before.includes(x)).map(id => BADGES.find(x => x.id === id));
      if (st > prevStreak || nb.length) return celebrate(st, prevStreak, nb);
      render(); toast("سجّلناك حاضر ✓");
    } else {
      render();
      toast(prevStreak && streakOf(me.id) < prevStreak ? "سجّلناك غايب. الشعلة طفت، ولّعها الدرس الجاي" : "سجّلناك غايب. الدرس الجاي لا يفوتك",
        () => { if (prev) S.att[lid][me.id] = prev; else delete S.att[lid][me.id]; save(); render(); });
    }
  });
}

function celebrate(st, prev, newBadges){
  const msg = st <= 1 ? ["ولّعت شعلة!","احضر الدرس الجاي وتبدأ سلسلتك"]
    : st === 2 ? ["بدأت السلسلة!","شعلتين ورا بعض، كمّل"]
    : st < 5 ? ["الشعلة تكبر!", ar(st) + " دروس ورا بعض"]
    : ["ما شاء الله تبارك الله!", ar(st) + " دروس ورا بعض، أنت قدوة"];
  const c = document.createElement("div"); c.className = "celebrate"; c.setAttribute("role","dialog"); c.setAttribute("aria-modal","true");
  c.innerHTML = `<div class="box">${flame()}<div class="big num" id="cnt">${ar(prev)}</div><h2>${msg[0]}</h2><p>${msg[1]}</p>
    ${newBadges.length ? `<p style="color:#FFC2C3;margin-top:8px">وسام جديد</p><div class="newb">${newBadges.map(b => `<div class="badge">${medalSVG(b,true)}<b>${b.name}</b></div>`).join("")}</div>` : ""}
    <button class="btn" id="cel-ok">تمام</button></div>`;
  document.body.appendChild(c);
  setTimeout(() => { const e = $("#cnt"); if (e) e.textContent = ar(st); }, 450);
  confetti();
  $("#cel-ok").onclick = () => { c.remove(); render(); };
  $("#cel-ok").focus();
}

function confetti(){
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas"); cv.className = "confetti"; document.body.appendChild(cv);
  const dpr = Math.min(2, window.devicePixelRatio||1), W = innerWidth, H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; const x = cv.getContext("2d"); x.scale(dpr,dpr);
  const cols = ["#FF3C40","#FFC2C3","#872457","#A9A6D6","#FFFFFF","#FF6A6D"];
  const ps = Array.from({length:140}, () => ({ x: W/2 + (Math.random()-.5)*80, y: H*.42, vx:(Math.random()-.5)*12, vy:-Math.random()*13-4, s:4+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[Math.floor(Math.random()*cols.length)], sl:Math.random()<.35 }));
  let f = 0; (function tick(){ x.clearRect(0,0,W,H); ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; if (p.sl) x.fillRect(-p.s, -1.5, p.s*2, 3); else x.fillRect(-p.s/2,-p.s/2,p.s,p.s); x.restore(); }); if (++f < 170) requestAnimationFrame(tick); else cv.remove(); })();
}

/* ==================== المشرف ==================== */

    <main class="wrap">${body}</main>

function adLessons(){
  const ls = lessonsSorted(), N = S.students.length;

        <div class="counts"><span class="chip ok">${ar(p)} حاضر</span>${a?`<span class="chip red">${ar(a)} غايب</span>`:""}${none?`<span class="chip">${ar(none)} ما سجّلوا</span>`:""}</div></div></button></li>`; }).reverse().join("")}</ol>

function adStudents(){

  return `<section class="stack">

function riskList(){ const ls = lessonsSorted().slice(-3, -1); if (ls.length < 2) return []; return S.students.filter(s => ls.every(l => !isAtt(l.id, s.id))); }

function adReports(){
  const ls = lessonsSorted(), N = S.students.length;
  const avg = ls.length && N ? Math.round(100 * ls.reduce((t,l) => t + countOf(l.id,"p"), 0) / (ls.length*N)) : 0;
  const streaks = S.students.map(s => ({ s, st: streakOf(s.id) })).sort((a,b) => b.st-a.st);
  const risk = riskList();
  const max = Math.max(1, ...ls.map(l => countOf(l.id,"p")));
  const champs = ranked(monthCounts()).filter(r => r.n).slice(0,3);
  return `<section class="stack">
    <div class="kpis"><div class="kpi"><span class="num">${ar(avg)}٪</span><small>متوسط الحضور</small></div><div class="kpi"><span class="num">${ar(N)}</span><small>طالب</small></div><div class="kpi"><span class="num">${ar(streaks[0]?.st||0)}</span><small>أطول شعلة</small></div></div>
    <div class="sec-h"><h2>الحضور في كل درس</h2></div>
    <div class="card"><div class="bars">${ls.map(l => { const n = countOf(l.id,"p"); return `<div class="b" title="${esc(l.title)}"><em>${ar(n)}</em><span style="height:${Math.max(4, 100*n/max)}%"></span><small>${ar(l.n)}</small></div>`; }).join("")}</div><div class="muted small" style="text-align:center">رقم الدرس</div></div>
    <div class="sec-h"><h2>يحتاجون متابعة</h2><span class="chip red">${ar(risk.length)}</span></div>
    <div class="card list" style="padding-block:4px">${risk.length ? risk.map(s => `<div class="li"><span class="avatar">${initials(s.name)}</span><div class="grow"><div class="nm">${esc(s.name)}</div><div class="sub">ما حضر الدرسين اللي قبل الأخير</div></div><span class="code-tag">${s.code}</span></div>`).join("") : `<p class="muted" style="text-align:center;margin:12px 0">ما فيه أحد غاب درسين ورا بعض</p>`}</div>
    <div class="sec-h"><h2>أبطال ${monthName()}</h2></div>
    ${champs.length ? lbRows(champs, "") : `<p class="muted">ما فيه حضور هالشهر للحين</p>`}
    <div class="sec-h"><h2>أطول الشعلات</h2></div>
    <div class="card list" style="padding-block:4px">${streaks.filter(x => x.st).slice(0,5).map(x => `<div class="li"><svg style="width:22px;height:26px;flex:none" viewBox="0 0 46 54" aria-hidden="true"><use href="#i-flame"/></svg><div class="grow nm">${esc(x.s.name)}</div><span class="num" style="font-size:20px;font-weight:700">${ar(x.st)}</span></div>`).join("") || `<p class="muted" style="text-align:center;margin:12px 0">ما فيه شعلات للحين</p>`}</div>
    <button class="btn ghost block" id="copy-report">${ic("i-copy")} انسخ التقرير للواتساب</button>
  </section>`;
}

function bindAdmin(){
  bindDemo();
  $("#logout").onclick = () => setSession(null);
  $("#settings").onclick = openSettings;
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => go(b.dataset.tab));
  if (tab === "home") {
    $("#add-ls").onclick = () => lessonEdit();
    document.querySelectorAll("[data-ls]").forEach(b => b.onclick = () => lessonSheet(b.dataset.ls));
  }
  if (tab === "students") {
    const q = $("#q"); q.oninput = () => { adQuery = q.value; const pos = q.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos,pos); };
    $("#add-st").onclick = addStudents;
    document.querySelectorAll("[data-st]").forEach(b => b.onclick = () => studentSheet(b.dataset.st));
    $("#copy-codes").onclick = () => copyText("رموز دخول أفق\n\n" + [...S.students].sort((a,b) => a.name.localeCompare(b.name,"ar")).map(s => `${s.name}: ${s.code}`).join("\n"));
  }
  if (tab === "reports") {
    $("#copy-report").onclick = () => {
      const r = ranked(monthCounts()).filter(x => x.n).slice(0,5);
      copyText(`تقرير أفق · ${monthName()}\n\nأبطال الشهر:\n${r.map(x => `${x.pos}. ${x.s.name} (${x.n} حضور)`).join("\n")}\n\nيحتاجون متابعة:\n${riskList().map(s => "• " + s.name).join("\n") || "ما فيه أحد"}`);
    };
  }
}

function setMark(lid, sid, m){ const a = (S.att[lid] ||= {}); if (!m) delete a[sid]; else a[sid] = { s:m, t: a[sid]?.s === m ? a[sid].t : Date.now() }; save(); }
function markBtns(lid, sid){ const m = markOf(lid, sid);
  return `<div class="pa sm" role="group"><button data-set="p" data-l="${lid}" data-s="${sid}" aria-pressed="${m==="p"}">حاضر</button><button data-set="a" data-l="${lid}" data-s="${sid}" aria-pressed="${m==="a"}">غايب</button></div>`; }
function bindMarkBtns(root, after){ root.querySelectorAll("[data-set]").forEach(b => b.onclick = () => { const cur = markOf(b.dataset.l, b.dataset.s); setMark(b.dataset.l, b.dataset.s, cur === b.dataset.set ? "" : b.dataset.set); after(); }); }

function lessonSheet(lid){
  const l = lessonById(lid); if (!l) return;
  const groups = [["p","حاضر"],["a","غايب"],["","ما سجّلوا"]];
  const byName = (x,y) => x.name.localeCompare(y.name,"ar");
  sheet(`<div class="row" style="margin-bottom:6px"><span class="ln num" style="width:44px;height:44px;font-size:20px">${ar(l.n)}</span><div class="grow"><h3 style="margin:0">${esc(l.title)}</h3><div class="muted small">${fmtDate(l.date)}</div></div></div>
    ${groups.map(([m,lb]) => { const list = S.students.filter(s => markOf(l.id,s.id) === m).sort(byName);
      return `<div class="sec-h" style="margin:14px 0 6px"><h2 style="font-size:17px">${lb} (${ar(list.length)})</h2></div><div class="card list" style="padding-block:2px">${list.map(s => `<div class="li"><span class="avatar">${initials(s.name)}</span><div class="grow nm">${esc(s.name)}</div>${markBtns(l.id, s.id)}</div>`).join("") || `<p class="muted small" style="text-align:center;margin:8px 0">ما فيه أحد</p>`}</div>`; }).join("")}
    <p class="muted small">تقدر تعدّل حضور أي طالب من هنا.</p>
    <div class="stack"><button class="btn block" id="cp-roll">${ic("i-copy")} انسخ الكشف للواتساب</button>
    <div class="row"><button class="btn ghost grow" id="ls-edit">عدّل الدرس</button><button class="btn ghost grow" id="ls-del" style="color:var(--red)">احذف</button></div></div>`, s => {
    bindMarkBtns(s, () => { const y = s.querySelector(".sheet").scrollTop; lessonSheet(lid); $("#scrim .sheet").scrollTop = y; render(); });
    $("#cp-roll").onclick = () => { const g = m => S.students.filter(s => markOf(l.id,s.id) === m).sort(byName);
      copyText(`كشف حضور أفق\nالدرس ${l.n}: ${l.title}\n${fmtDate(l.date)}\n\nحاضر (${g("p").length}):\n${g("p").map((s,i) => `${i+1}. ${s.name}`).join("\n")}\n\nغايب (${g("a").length}):\n${g("a").map((s,i) => `${i+1}. ${s.name}`).join("\n")}` + (g("").length ? `\n\nما سجّلوا (${g("").length}):\n${g("").map((s,i) => `${i+1}. ${s.name}`).join("\n")}` : "")); };
    $("#ls-edit").onclick = () => lessonEdit(lid);
    $("#ls-del").onclick = () => sheet(`<h3>تحذف «${esc(l.title)}»؟</h3><p class="muted">بينحذف الدرس وكل حضوره.</p><div class="row"><button class="btn ghost grow" onclick="closeSheet()">رجوع</button><button class="btn danger grow" id="d-yes">احذفه</button></div>`, () => {
      $("#d-yes").onclick = () => { S.lessons = S.lessons.filter(x => x.id !== l.id); delete S.att[l.id]; lessonsSorted().forEach((x,i) => x.n = i+1); save(); closeSheet(); render(); toast("انحذف"); };
    });
  });
}

function lessonEdit(lid){
  const l = lid ? lessonById(lid) : null, nextN = S.lessons.length + 1;
  sheet(`<h3>${l ? "تعديل الدرس " + ar(l.n) : "الدرس " + ar(nextN)}</h3>
    <form id="ls-f" class="stack"><div><label class="lbl" for="ls-t">عنوان الدرس</label><input class="field" id="ls-t" value="${esc(l?.title||"")}" placeholder="مثال: عمر بن الخطاب ٢"></div>
      <div><label class="lbl" for="ls-d">التاريخ</label><input class="field" id="ls-d" type="date" value="${l?.date || todayISO()}"></div>
      <button class="btn block" type="submit">${l ? "احفظ" : "أضف الدرس"}</button></form>`, () => {
    $("#ls-t").focus();
    $("#ls-f").onsubmit = e => { e.preventDefault(); const t = $("#ls-t").value.trim(), d = $("#ls-d").value || todayISO(); if (!t) return $("#ls-t").focus();
      if (l) { l.title = t; l.date = d; } else S.lessons.push({ id:"L"+uid(), n:nextN, title:t, date:d });
      save(); closeSheet(); render(); toast(l ? "انحفظ" : "انضاف الدرس " + ar(nextN)); };
  });
}

function newCode(){ const used = new Set([S.adminCode, ...S.students.map(s => s.code)]); let c; do c = pin4(); while (used.has(c)); return c; }

function addStudents(){
  sheet(`<h3>أضف طلاب</h3><p class="muted small" style="margin:0 0 10px">اكتب كل اسم في سطر. تقدر تلصق القائمة كاملة من الواتساب، وكل طالب ياخذ رمز لحاله.</p>
    <form id="add-f" class="stack"><textarea class="field" id="names" placeholder="محمد العتيبي&#10;فيصل القحطاني"></textarea><button class="btn block" type="submit">أضفهم</button></form>`, () => {
    $("#names").focus();
    $("#add-f").onsubmit = e => { e.preventDefault();
      const names = $("#names").value.split(/\n/).map(x => x.replace(/^[\s\d٠-٩.\-–•)]+/,"").trim()).filter(Boolean);
      if (!names.length) return;
      const added = names.map(n => { const s = { id:"S"+uid(), name:n, code:newCode() }; S.students.push(s); return s; });
      save(); closeSheet(); render();
      sheet(`<h3>انضافوا ${ar(added.length)} ✓</h3><p class="muted small" style="margin:0 0 10px">أرسل لكل واحد رمزه:</p><div class="card list" style="padding-block:4px">${added.map(s => `<div class="li"><div class="grow nm">${esc(s.name)}</div><span class="code-tag">${s.code}</span></div>`).join("")}</div><div class="stack" style="margin-top:12px"><button class="btn block" id="cp-new">${ic("i-copy")} انسخ الرموز</button></div>`, () => {
        $("#cp-new").onclick = () => copyText(added.map(s => `${s.name}: ${s.code}`).join("\n"));
      });
    };
  });
}

function studentSheet(sid){
  const s = S.students.find(x => x.id === sid); if (!s) return;
  const ls = lessonsSorted().reverse();
  sheet(`<div class="row" style="margin-bottom:10px"><span class="avatar" style="width:52px;height:52px;font-size:20px">${initials(s.name)}</span><div class="grow"><h3 style="margin:0">${esc(s.name)}</h3><div class="muted small">رمز الدخول <span class="code-tag">${s.code}</span></div></div></div>
    <div class="kpis" style="margin-bottom:14px"><div class="kpi"><span class="num">${ar(totalOf(s.id))}</span><small>حاضر</small></div><div class="kpi"><span class="num">${ar(absentOf(s.id))}</span><small>غايب</small></div><div class="kpi"><span class="num">${ar(streakOf(s.id))}</span><small>الشعلة</small></div></div>
    <label class="lbl">الدروس</label>
    <div class="card list" style="padding-block:2px;margin-bottom:14px">${ls.map(l => `<div class="li"><span class="ln num sm">${ar(l.n)}</span><div class="grow"><div class="nm" style="font-size:15px">${esc(l.title)}</div><div class="sub">${fmtShort(l.date)}</div></div>${markBtns(l.id, s.id)}</div>`).join("")}</div>
    <form id="ed-f" class="stack"><div><label class="lbl" for="ed-name">الاسم</label><input class="field" id="ed-name" value="${esc(s.name)}"></div>
      <button class="btn block" type="submit">احفظ الاسم</button>
      <div class="row"><button type="button" class="btn ghost grow" id="cp-code">${ic("i-copy")} انسخ الرمز</button><button type="button" class="btn ghost grow" id="re-code">${ic("i-refresh")} رمز جديد</button></div>
      <button type="button" class="btn ghost block" id="del-st" style="color:var(--red)">احذف الطالب</button></form>`, sc => {
    bindMarkBtns(sc, () => { const y = sc.querySelector(".sheet").scrollTop; studentSheet(sid); $("#scrim .sheet").scrollTop = y; render(); });
    $("#ed-f").onsubmit = e => { e.preventDefault(); const v = $("#ed-name").value.trim(); if (!v) return; s.name = v; save(); closeSheet(); render(); toast("انحفظ"); };
    $("#cp-code").onclick = () => copyText(`${s.name}\nرمز دخول أفق: ${s.code}`);
    $("#re-code").onclick = () => { s.code = newCode(); save(); studentSheet(sid); render(); toast("الرمز الجديد " + s.code); };
    $("#del-st").onclick = () => sheet(`<h3>تحذف ${esc(s.name)}؟</h3><p class="muted">بينحذف هو وسجل حضوره، وما يقدر يدخل بعدها.</p><div class="row"><button class="btn ghost grow" onclick="closeSheet()">لا، رجوع</button><button class="btn danger grow" id="del-yes">إيه، احذفه</button></div>`, () => {
      $("#del-yes").onclick = () => { S.students = S.students.filter(x => x.id !== sid); Object.values(S.att).forEach(a => delete a[sid]); save(); closeSheet(); render(); toast("انحذف"); };
    });
  });
}

function openSettings(){
  sheet(`<h3>الإعدادات</h3><form id="set-f" class="stack">
      <div><label class="lbl" for="set-ac">رمز المشرف</label><input class="field code-input" id="set-ac" inputmode="numeric" maxlength="6" value="${esc(S.adminCode)}"></div>
      <button class="btn block" type="submit">احفظ</button>
      ${S.demo ? `<button type="button" class="btn ghost block" id="reset">رجّع البيانات التجريبية من جديد</button>` : ""}
    </form>`, () => {
    $("#set-f").onsubmit = e => { e.preventDefault(); const v = toLatin($("#set-ac").value); if (v.length < 4) return toast("الرمز ٤ أرقام على الأقل"); if (S.students.some(s => s.code === v)) return toast("هذا رمز طالب، اختر غيره"); S.adminCode = v; save(); closeSheet(); toast("تغيّر رمز المشرف"); };
    const r = $("#reset"); if (r) r.onclick = () => { S = seed(); save(); closeSheet(); setSession({ role:"admin" }); toast("رجعت البيانات التجريبية"); };
  });
}

/* تحديث تلقائي لو تغيّرت البيانات من تبويب ثاني */
window.addEventListener("storage", e => { if (e.key === KEY) { S = lsGet(KEY) || S; if (!$("#scrim") && !$(".celebrate")) render(); } });
render();
</script>
